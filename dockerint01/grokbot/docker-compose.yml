# Grok Bot desktop app (official Linux build) streamed to the browser via Xpra HTML5
# Access: https://grokbot.internal.earles.io behind Authentik forward auth (see README.md)
services:
  grokbot:
    image: grokbot-xpra:local
    build:
      context: .
      args:
        INSTALLER: ${GROKBOT_INSTALLER:?set GROKBOT_INSTALLER in .env}
    container_name: grokbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/home:/home/grokbot # App profile, keyring, Firefox profile
    # ports:
    #   - 127.0.0.1:14500:14500 # Debug only: bypasses Authentik, never bind to 0.0.0.0
    networks:
      - traefik
    shm_size: 2gb # Chromium/Electron needs more than the 64 MB default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:14500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.grokbot.rule=Host(`grokbot.internal.earles.io`)
      - traefik.http.routers.grokbot.entrypoints=websecure
      - traefik.http.routers.grokbot.tls.certresolver=production
      # Authentik forward auth, defined in ../traefik/config/conf/authentik-forwardauth.yaml
      - traefik.http.routers.grokbot.middlewares=authentik@file
      - traefik.http.services.grokbot.loadbalancer.server.port=14500

networks:
  traefik:
    external: true
