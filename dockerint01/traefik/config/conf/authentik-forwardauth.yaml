# Authentik forward auth via the embedded outpost in authentik-server (dockerint01/authentik)
# Use on a router with: traefik.http.routers.<name>.middlewares=authentik@file
# Each protected host also needs an outpost router below and a Proxy Provider
# (Forward auth, single application) assigned to the authentik Embedded Outpost.
http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  routers:
  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
