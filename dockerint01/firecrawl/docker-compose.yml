services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # ports:
    #   - "3002:3002"
    networks:
      - traefik
      - backend
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    command: node dist/src/harness.js --start-docker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.firecrawl.rule=Host(`firecrawl.internal.earles.io`)
      - traefik.http.routers.firecrawl.entrypoints=websecure
      - traefik.http.routers.firecrawl.tls.certresolver=production
      - traefik.http.services.firecrawl.loadbalancer.server.port=3002

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      - PORT=3000
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - ALLOW_LOCAL_WEBHOOKS=${ALLOW_LOCAL_WEBHOOKS:-false}
      - BLOCK_MEDIA=${BLOCK_MEDIA:-false}
      - MAX_CONCURRENT_PAGES=${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

  firecrawl-redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-firecrawl}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-firecrawl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

volumes:
  postgres_data:

networks:
  traefik:
    external: true
  backend:
    external: false
