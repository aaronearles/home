<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#161616">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coords">
  <title>MC Coords</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="btn-drawer" aria-label="Worlds">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="world-title">MC Coords</h1>
      <span class="live-dot" id="live-dot" title="Live sync"></span>
      <button class="icon-btn" id="btn-invite" aria-label="Invite friends">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M1.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7M19 8v6M16 11h6"/></svg>
      </button>
    </header>

    <main id="main">
      <section class="view" id="view-coords">
        <nav class="tabs" id="list-tabs" role="tablist">
          <button data-tab="bookmarks" class="active">Bookmarks</button>
          <button data-tab="overworld">Over</button>
          <button data-tab="nether">Nether</button>
          <button data-tab="end">End</button>
        </nav>
        <div class="search-row">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="list-search" type="search" placeholder="Search locations…" autocomplete="off">
          </label>
        </div>
        <div id="list" class="list"></div>
        <button class="fab" id="fab-add" aria-label="Add location">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </section>

      <section class="view" id="view-map" hidden>
        <nav class="tabs" id="map-tabs" role="tablist">
          <button data-dim="overworld" class="active">Over</button>
          <button data-dim="nether">Nether</button>
          <button data-dim="end">End</button>
        </nav>
        <div class="map-wrap" id="map-wrap">
          <canvas id="map-canvas"></canvas>
          <div class="map-overlay-top">
            <label class="search map-search">
              <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <input id="map-search" type="search" placeholder="Search locations…" autocomplete="off" list="map-search-list">
              <datalist id="map-search-list"></datalist>
            </label>
            <label class="toggle" id="ghost-toggle-wrap">
              <span id="ghost-label">NETHER</span>
              <input type="checkbox" id="ghost-toggle"><span class="slider"></span>
            </label>
          </div>
          <div class="map-scale" id="map-scale"></div>
          <div class="map-cursor" id="map-cursor"></div>
          <div class="map-buttons">
            <button class="icon-btn round" id="map-fit" aria-label="Fit all">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            </button>
            <button class="icon-btn round" id="map-origin" aria-label="Go to 0,0">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            </button>
          </div>
          <div class="sheet" id="map-sheet" hidden></div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden></section>
    </main>

    <nav class="bottombar" id="bottombar">
      <button data-view="coords" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>Coords</span>
      </button>
      <button data-view="map">
        <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        <span>Map</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
