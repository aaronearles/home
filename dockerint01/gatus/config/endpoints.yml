default-endpoint: &defaults
  interval: 60s
  client:
    insecure: true
    timeout: 30s
  conditions:
    - "[CONNECTED] == true"
  alerts:
    - type: ntfy

endpoints:

  - name: Thermostat
    group: Home
    url: icmp://thermostat.earles.internal
    conditions:
      - "[CONNECTED] == true"

  # - name: DMZ_Reverse_Proxy
  #   group: Infrastructure
  #   <<: *defaults
  #   url: "http://dmz.earles.internal:81/"

  # - name: Self
  #   group: Infrastructure
  #   <<: *defaults
  #   url: http://docker.earles.internal:8080

  - name: EarlesGoneWild External
    group: Public
    <<: *defaults
    url: https://earlesgonewild.blog

  # - name: EarlesGoneWild Internal
  #   group: Public
  #   <<: *defaults
  #   url: http://earlesgonewild.earles.internal

  - name: Grok Bot
    group: Internal
    <<: *defaults
    url: https://grokbot.internal.earles.io/
    client:
      insecure: true
      ignore-redirect: true
      timeout: 30s
    conditions:
      - "[STATUS] == 302" # Authentik redirect; a 200 means the stream is reachable without auth
