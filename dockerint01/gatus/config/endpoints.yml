default-endpoint: &defaults
  interval: 60s
  client:
    insecure: true
    timeout: 30s
  conditions:
    - "[CONNECTED] == true"
    - "[STATUS] == 200"
  alerts:
    - type: ntfy

endpoints:

  # =============================================================================
  # INFRASTRUCTURE & CORE SERVICES
  # =============================================================================

  - name: Traefik Proxy
    group: Infrastructure
    <<: *defaults
    url: "http://dockerint01.earles.internal:8080/api/overview"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Authentik SSO
    group: Infrastructure
    <<: *defaults
    url: "https://authentik.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: OpenBao
    group: Infrastructure
    <<: *defaults
    url: "https://vault.internal.earles.io/v1/sys/health"
    conditions:
      - "[STATUS] == 200" # 429 standby, 503 sealed, 501 uninitialized
      - "[BODY].sealed == false"

  - name: Vaultwarden
    group: Infrastructure
    <<: *defaults
    url: "https://vaultwarden.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Proxmox VE
    group: Infrastructure
    <<: *defaults
    url: "https://pve.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: NAS
    group: Infrastructure
    <<: *defaults
    url: "https://nas.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================

  - name: Gatus Status
    group: Monitoring
    <<: *defaults
    url: "https://gatus.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Uptime Kuma
    group: Monitoring
    <<: *defaults
    url: "https://uptime.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Beszel Hub
    group: Monitoring
    <<: *defaults
    url: "https://beszel.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Dozzle Logs
    group: Monitoring
    <<: *defaults
    url: "https://dozzle.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: ChangeDetection
    group: Monitoring
    <<: *defaults
    url: "https://changedetection.internal.earles.io/"
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: Gotify
    group: Monitoring
    <<: *defaults
    url: "https://gotify.internal.earles.io/health"
